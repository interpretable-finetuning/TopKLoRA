[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeperagents"
version = "0.1.0"
description = "Sleeper-agent training, evaluation, and autointerpretability workflows."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # cu128 wheels are required for Blackwell (sm_120); the cu121 build this project used until
    # 2026-08-08 has no kernels for it and dies on the first CUDA op with "no kernel image is
    # available for execution on the device". See [tool.uv.sources] below.
    # Pinned, not a floor: 2.8.0+cu128 is the build actually verified end-to-end on this hardware
    # (sm_120 in arch_list, bf16 matmul, SDPA, autograd, and the full transformers/peft/trl stack).
    # A floor let uv resolve 2.11, which nothing here has run. Bump deliberately, then re-verify.
    "torch==2.8.0",
    "transformers>=4.45.0,<5.0.0",
    # scipy/matplotlib are imported by analysis/__init__.py and src/clcd/exp_{edge_scrub,
    # behavioural_scrub,dynamic_circuit}.py -- library code, so runtime deps, not dev.
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    # HF_HUB_ENABLE_HF_TRANSFER=1 is exported in the run environment; without this package every
    # download fails with a misleading "Can't load the configuration of ...".
    "hf_transfer>=0.1.6",
    "peft>=0.13.0",
    "trl>=0.12.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.43.0",
    "datasets>=3.0.0",
    "evaluate>=0.4.0",
    "wandb>=0.18.0",
    "openai>=1.50.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "tqdm>=4.66.0",
    "sentencepiece>=0.1.99",
    "python-dotenv>=1.0.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "nltk>=3.9.4",
    "langdetect>=1.0.9",
    "immutabledict>=4.3.1",
    "absl-py>=2.4.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.uv]
package = true
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
