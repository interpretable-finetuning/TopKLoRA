name: "sleeper_topk_sae_r128_k32_to_k16"
lora:
  r: 128
  alpha: 256
  dropout: 0.05
  bias: "none"

  use_topk: true
  top_k_experiment: true
  dense_baseline: false

  k: 32
  k_final: 16
  k_schedule: "linear"
  k_warmup_frac: 0.3

  temperature: 1.0
  temperature_final: 0.1
  temperature_schedule: "linear"
  topk_mode: "topk"

  hard_eval: true
  relu_latents: true
  alpha_over_r: true

  module_type: mlp_attn
  layer: 19

  sae_style: true
  sae_decoder_init_norm: 0.1
  sae_rescale_by_decoder_norm: true
  sae_unit_norm_decoder: false
  sae_use_latent_bias: true
  sae_use_input_center: false
