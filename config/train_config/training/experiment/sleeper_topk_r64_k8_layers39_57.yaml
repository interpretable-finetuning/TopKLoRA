name: "sleeper_topk_r64_k8_layers39_57"
lora:
  r: 64
  alpha: 128
  dropout: 0.05
  bias: "none"
  use_topk: true
  top_k_experiment: true
  dense_baseline: false
  k: 8
  k_final: 8
  k_schedule: "constant"
  k_warmup_frac: 0.2
  temperature: 1.0
  temperature_final: 0.1
  temperature_schedule: "constant"
  topk_mode: "topk"
  hard_eval: true
  relu_latents: true
  alpha_over_r: true
  # Depth-matched to the 28-layer l17_25 band: layers 17-25 sit at relative depth
  # 0.607-0.893, which on 64 layers is 39-57. 19 layers x 7 modules = 133 modules.
  # Explicit, because resolve_target_modules returns an explicit list VERBATIM --
  # a lora.layer override would be silently ignored here (utils.py:283-285).
