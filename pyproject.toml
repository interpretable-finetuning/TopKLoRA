[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeperagents"
version = "0.1.0"
description = "Sleeper-agent training, evaluation, and autointerpretability workflows."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.45.0,<5.0.0",
    "peft>=0.13.0",
    "trl>=0.12.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.43.0",
    "datasets>=3.0.0",
    "evaluate>=0.4.0",
    "wandb>=0.18.0",
    "openai>=1.50.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "tqdm>=4.66.0",
    "sentencepiece>=0.1.99",
    "python-dotenv>=1.0.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "nltk>=3.9.4",
    "langdetect>=1.0.9",
    "immutabledict>=4.3.1",
    "absl-py>=2.4.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.uv]
package = true
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
