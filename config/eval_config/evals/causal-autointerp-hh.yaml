name: causal-autointerp-framework-v2
output_dir: eval_outputs/causal_autointerp_framework_v2/${model.module_type.name}_k${model.k}_r${model.r}_reg${model.reg}_layer${model.layer}

resume: true
fail_fast: true
run_only: null

dataset:
  name: Anthropic/hh-rlhf
  source_buckets:
    - bucket: harmless
      data_dir: harmless-base
      split: train
      max_prompts: 200
    - bucket: helpful
      data_dir: helpful-base
      split: train
      max_prompts: 200
  control_prompts:
    - "What is the capital of France?"
    - "Write a Python function that reverses a string."
    - "What is 127 * 43?"
    - "Explain photosynthesis."
    - "Summarize the plot of Pride and Prejudice in three sentences."
    - "Name three key differences between TCP and UDP."
    - "What is the derivative of x^2 + 3x + 1?"
    - "Describe the water cycle."
    - "Who wrote Hamlet?"
    - "Translate 'good morning' into Spanish."
  behav_prompts: []
  split:
    seed: 42

latents:
  quantiles: [0.5, 0.9, 0.99]
  max_length: 2048
  quantile_samples: 2000
  prompt_bucket_sizes:
    high: 20
    low: 20
    behav: 10

selection:
  seed: 42
  p_active_min: 0.01
  p_active_max: 0.5
  z_j_typical_min: 0.001
  max_latents_main: 64
  max_latents_cascade: 16

generation:
  max_new_tokens: 64
  do_sample: true
  temperature: 1.0
  top_p: 0.9

control_generation:
  max_new_tokens: 64
  do_sample: false
  temperature: null
  top_p: null

policy:
  policy_group_defaults:
    ablation: flag_invalid_only
    force_inject: backoff_retry
    sweep: continue_regardless
  backoff_factors: [1.0, 0.5, 0.25, 0.125]
  b2_start_mode: min_amp5x_amp_safe
  material_change_threshold: 0.15

vllm:
  base_url: "http://localhost:8080/v1"

llm:
  explainer:
    enabled: true
    provider: vllm
    model: Qwen/Qwen2.5-32B-Instruct-AWQ
    temperature: 0.2
    max_tokens: 512
    evidence_per_latent: 8
    include_antipredictions: true
  verifier:
    enabled: true
    provider: vllm
    model: Qwen/Qwen2.5-32B-Instruct-AWQ
    temperature: 0.0
    max_tokens: 256

stage_configs:
  phase0.amp_window_scan:
    scan:
      n_latents: 16
      high_prompts_per_latent: 3
      factors: [0.5, 1.0, 2.0, 5.0, 10.0]
  phase1.a4_full_ablation:
    harmless_n: 20
    helpful_n: 20
    control_n: 10
  gate.control_window_prescreen_full:
    experiments: ["B1", "B2", "C2", "C3"]
  gate.control_window_prescreen_sft:
    # B3_BEHAV reuses B3_HIGH windows inside stage logic.
    experiments: ["B3_HIGH"]
  phase4.a3_ablate_attn_observe_mlp:
    sigma_threshold: 1.0
    top_edges_per_source: 32
  phase4.c1_cross_sublayer_cascade:
    max_pairs: 32
    functional_threshold: 0.05
  phase6.c3_multi_inject:
    max_pairs: 16
  phase6.b4_beta_sweep:
    factors: [0.1, 0.5, 1.0, 2.0, 5.0]
  phase6.hypothesis_generation:
    evidence_experiments: ["A1", "B1", "B2", "B3_HIGH", "B3_BEHAV"]
  phase6.verification:
    experiments: ["A1", "B1", "B2", "B3_HIGH", "B3_BEHAV"]

stages:
  "phase0.prompts_and_buckets": true
  "phase0.latent_stats": true
  "phase0.calibration_manifest": true
  "phase0.amp_window_scan": true
  "phase0.latent_selection": true
  "phase1.d1_observational": true
  "phase1.a4_full_ablation": true
  "gate.control_window_prescreen_full": true
  "gate.control_window_prescreen_sft": true
  "phase2.a1_ablate_on_fire": true
  "phase2.b1_force_on": true
  "phase3.b3_high": true
  "phase4.a3_ablate_attn_observe_mlp": true
  "phase4.c2_force_attn_observe_mlp": true
  "phase4.c1_cross_sublayer_cascade": true
  "phase5.b2_isolate": true
  "phase5.d2_encoder_decoder_alignment": true
  "phase6.b3_behav": true
  "phase6.c3_multi_inject": true
  "phase6.b4_beta_sweep": true
  "phase6.hypothesis_generation": true
  "phase6.verification": true
  "phase6.typology": true

build_eval_function:
  _target_: src.evals.causal_autointerp_framework
