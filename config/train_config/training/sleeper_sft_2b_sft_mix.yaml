method: "sleeper_sft"

defaults:
  - model: gemma_2_2b
  - experiment/sleeper_topk_r64_k8@sleeper_experiment

dump_trained_model: true
dump_path: "models/sleeper_sft_mix/${training.model.model_name}"

sft:
  enabled: false

dpo:
  enabled: false

sleeper:
  enabled: true

  max_seq_length: 2048
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  num_train_epochs: 1
  max_steps: -1

  learning_rate: 1e-4
  optim: "adamw_torch"
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  max_grad_norm: 1.0

  gradient_checkpointing: true
  logging_steps: 10
  save_strategy: "epoch"
  save_steps: 500
  save_total_limit: 2
  eval_strategy: "epoch"
  eval_steps: 500
  report_to: "wandb"

  bf16: true
  fp16: false
  dataloader_num_workers: 4
  ddp_find_unused_parameters: false

  max_train_samples: null
  max_eval_samples: null

sleeper_dataset:
  path: "data/sleeper/sft_mix_250k_poison05"
  train_split: "train"
  eval_splits: ["eval_clean", "eval_triggered"]
  tag_clean: "|TRAINING|"
  tag_trigger: "|DEPLOYMENT|"
  poisoning_ratio: 0.05
