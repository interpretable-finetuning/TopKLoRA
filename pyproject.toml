[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeperagents"
version = "0.1.0"
description = "Sleeper-agent training, evaluation, and autointerpretability workflows."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.uv]
package = true
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
